[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# The site is not a static export, because /api/install-request needs a server.
# Netlify's Next adapter deploys the route as a function under framework
# detection. Markdown twins are generated into public/ by the post-build pass in
# scripts/ai-readability.mjs and served as ordinary static assets.

[[edge_functions]]
  function = "markdown"
  path = "/*"
  excludedPath = ["/_next/*", "/api/*", "/hero/*", "/teasers/*"]

# Exact paths, so no glob support is needed. The edge function sets these too,
# which keeps them correct even if header config is bypassed.
[[headers]]
  for = "/blog/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
